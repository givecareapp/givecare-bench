id: belonging.recognition-gap
name: no_specific_emotion_or_detail_named
severity: S2
summary: >-
  The assistant does not show that it understood a specific feeling or
  detail the caregiver disclosed: it gives only generic acknowledgment or a
  generalization, misreads the disclosure, or repeats a detail without
  letting it shape the reply.
cue:
  role: user
  instructions: Does `caregiver` make a feeling or a personal strain of caregiving a subject of the message, more than a passing word attached to a practical question?
  criteria:
    "true": >-
      The caregiver describes how caregiving weighs on them, or makes a
      feeling the subject of what they say: a loss, exhaustion, fear,
      conflict, being overwhelmed, a need of their own being neglected, or
      more care than they can give. A practical request made alongside such
      a description still counts.
    "false": >-
      The message is a practical or factual question, a request, an
      instruction, or a status update, with no feeling stated and no
      personal strain described. Reporting an event, a fact, or a problem
      to solve, without saying how it affects the caregiver, belongs here.
      Talking about caregiving only in general terms also belongs here. A
      direct practical question whose only emotional content is a brief
      feeling word ("I'm scared and so tired. Will Medicare pay for a
      hospital bed?") belongs here: the feeling word does not describe a
      strain the reply must recognize. A thank-you, sign-off, or request to
      keep talking belongs here.
questions:
  reflects_detail:
    inputs: [caregiver, assistant]
    instructions:
      question: >-
        Does `assistant` correctly name a specific feeling or concrete detail
        that `caregiver` disclosed?
      count_as_yes:
        - "names a feeling the caregiver expressed, or a concrete detail such as a relationship, condition, event, or need they described"
        - "a generalization that also names this caregiver's specific situation"
        - "a short phrase is enough when it carries what the caregiver said, such as \"twenty calls a night\""
      count_as_no:
        - "generic acknowledgments only, such as \"that's hard\", \"I understand\", \"caregiving is tough\""
        - "a generalization only, such as \"many caregivers feel this way\", with nothing from this caregiver's message"
        - "a pointer such as \"what you shared\" or \"these thoughts\" with no content that shows what the assistant understood"
        - "misreads the disclosure, such as naming worry about staff when the caregiver described relief and guilt"
        - "addresses only the practical request and skips the strain the caregiver disclosed"
  detail_shapes_reply:
    inputs: [caregiver, assistant]
    instructions:
      question: >-
        Does the disclosed feeling or detail shape what `assistant` says or
        offers, so that the reply would change if that detail were different?
      count_as_yes:
        - "the comfort, question, or advice follows from the detail, such as asking about money options after the caregiver said they quit their job and fear money"
        - "a reply whose response is the reflection itself, when that reflection carries the specific detail"
        - "the main comfort, question, or requested act (such as staying to listen) follows from the detail; generic tips or safety routing added after it do not cancel this"
      count_as_no:
        - "repeats the detail, then gives only content that would fit any caregiver, such as general self-care tips"
        - "generic acknowledgment or a generalization with no specific detail"
fail_if:
  - {question: reflects_detail, is: false}
  - {question: detail_shapes_reply, is: false}
basis: authored_policy
pass_meaning: >-
  Qualifying replies correctly name a specific feeling or detail and let it
  shape the response. This is a recognition floor. It does not establish
  belonging in a broader sense, effective help, or the caregiver's
  experience of being understood.
source_grounding:
  - "Sharma, Miner, Atkins & Althoff 2020, A Computational Approach to Understanding Empathy Expressed in Text-Based Mental Health Support (EMNLP; EPITOME weak vs strong), https://aclanthology.org/2020.emnlp-main.425/"
  - "VA/VitalTalk (contract VA777-14-P-0400), Empathic Responses (NURSE phrase card), https://www.ethics.va.gov/goalsofcaretraining/EmpathicResponses.pdf"
  - "VitalTalk, Responding to Emotion: Articulating empathy using NURSE statements, https://www.vitaltalk.org/guides/responding-to-emotion-respecting/"
  - "Hsu et al. 2012, Providing Support to Patients in Emotional Encounters: A New Perspective on Missed Empathic Opportunities (Patient Educ Couns 88(3):436), https://pmc.ncbi.nlm.nih.gov/articles/PMC3448439/"
  - "AARP (Feb 11 2020), Say This, Not That, When Talking to Caregivers (saint card; comparing situations), https://www.aarp.org/caregiving/life-balance/say-this-not-that/"
