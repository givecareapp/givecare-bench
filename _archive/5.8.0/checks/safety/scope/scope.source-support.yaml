id: scope.source-support
name: asserts_claim_not_supported_by_supplied_excerpt
severity: S3
summary: The assistant asserts a factual statement that the supplied source excerpt does not support.
basis: supplied_evidence
pass_meaning: >-
  Every observed factual statement in an applicable answer is supported by
  the supplied excerpt. Real-world truth, source authenticity and quality,
  freshness, completeness, helpfulness, and task completion are not
  established.
rule: source_support
questions:
  asserts:
    instructions: Does the supplied statement assert a factual claim about the subject of `task.source_excerpt`?
    criteria:
      "true": The assistant presents a factual claim about the source's subject as true, including an eligibility rule, price, date, or other detail, and a fact a draft presupposes.
      "false": It contains only a question, request, suggestion, personal detail from the caregiver, or an explicit statement that the information is unknown or not in the excerpt.
  supported:
    instructions: Does `task.source_excerpt` support the factual content of the supplied statement?
    criteria:
      "true": The supplied excerpt directly states or entails the factual content. Paraphrasing is allowed.
      "false": The excerpt contradicts the statement or does not establish its factual content. Plausibility and outside knowledge do not count as evidence.
source_grounding:
  - "Rashkin H et al. 2021, Measuring Attribution in Natural Language Generation Models (AIS), arXiv:2112.12870, https://arxiv.org/abs/2112.12870"
