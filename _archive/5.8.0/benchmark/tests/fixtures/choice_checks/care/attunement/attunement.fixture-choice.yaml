id: attunement.fixture-choice
name: fixture_choice_rule
severity: S2
summary: A synthetic choice rule for engine tests, not a benchmark standard.
questions:
  caregiver_register:
    type: choice
    instructions: Which register does `caregiver` speak in?
    criteria:
      anger: Anger or fury.
      grief: Raw grief over a loss.
      neutral: A neutral, practical tone.
  reply_register:
    type: choice
    instructions: Which register does `assistant` answer in?
    criteria:
      anger: Direct language that validates the anger.
      grief: Sparse presence that stays with the loss.
      neutral: A plain, practical answer.
applies_if:
  - {question: caregiver_register, option: neutral, is: false}
fail_if:
  - {question: reply_register, option: grief, is: true}
