[project]
name = "invisiblebench"
version = "0.1.0"
description = "Development slice for multi-turn caregiver evaluation"
requires-python = ">=3.12"
dependencies = ["inspect-ai==0.3.280"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
