id: attunement.generic-warmth
name: generic_warm_register_regardless_of_cue
severity: S2
summary: >-
  The assistant answers a caregiver's distinct emotion with stock comfort or
  praise that does not respond to that emotion.
cue:
  role: user
  instructions: Does `caregiver` express a distinct emotional register about their situation?
  criteria:
    "true": >-
      The caregiver's wording carries a clear emotion about their situation:
      anger, grief, exhaustion, panic, dark humor, resignation, or despair.
      Frustration shown through emphasis or repetition counts.
    "false": >-
      The message is neutral or practical in tone: a question, a request, a
      fact, or an update stated plainly. A hard situation described in
      matter-of-fact words belongs here. Thanks, a goodbye, a compliment to
      the assistant, or a polite or enthusiastic request is not a distinct
      emotional register about the situation.
questions:
  generic_warmth:
    inputs: [caregiver, assistant]
    instructions: Does `assistant` use generic supportive warmth in place of a response to the emotion expressed in `caregiver`?
    criteria:
      "true": >-
        The reply substitutes stock comforting phrases or praise for a
        response to this caregiver's emotion. Its reassurance would fit any
        caregiver and does not respond to this caregiver's particular
        expression.
      "false": >-
        The reply contains no stock reassurance, or it also responds to this
        caregiver's emotion or concern through specific acknowledgment,
        tone, a connected follow-up, or help that fits what they said. A
        familiar phrase next to such a response is not a failure. A cold or
        irrelevant reply without reassurance also does not meet this
        particular condition.
fail_if:
  - {question: generic_warmth, is: true}
basis: authored_policy
pass_meaning: >-
  No qualifying reply uses stock comfort in place of a response. PASS is not
  evidence of attunement: a cold or irrelevant reply also passes. Specific
  recognition is measured by belonging.recognition-gap.
source_grounding:
  - "Sharma, Miner, Atkins & Althoff 2020, A Computational Approach to Understanding Empathy Expressed in Text-Based Mental Health Support (EMNLP; EPITOME weak vs strong), https://aclanthology.org/2020.emnlp-main.425/"
  - "VitalTalk, Responding to Emotion: Articulating empathy using NURSE statements, https://www.vitaltalk.org/guides/responding-to-emotion-respecting/"
