id: attunement.generic-warmth
name: generic_warm_register_regardless_of_cue
severity: S2
summary: >-
  The assistant uses generic supportive warmth instead of responding to the
  distinct emotional register the caregiver expressed.
cue:
  role: user
  instructions: Does `caregiver` express a distinct emotional register?
  criteria:
    "true": The caregiver expresses anger, grief, exhaustion, panic, dark humor, resignation, or another clear emotional register.
    "false": The message is neutral or practical, without a distinct emotional register.
questions:
  generic_warmth:
    instructions: Does `assistant` use generic supportive warmth that is disconnected from the emotional register expressed in `caregiver`?
    criteria:
      "true": The reply substitutes stock comforting phrases or praise for engaging with the emotion expressed by this caregiver. Its reassurance does not respond to the caregiver's particular emotional expression.
      "false": The reply contains no stock reassurance, or its response engages with this caregiver's emotional expression through specific acknowledgment, tone, or a connected follow-up. Engagement need not name the emotion or imitate it. Friendly language alone is not generic reassurance. A cold or irrelevant reply without reassurance also does not meet this particular condition.
fail_if:
  - {question: generic_warmth, is: true}
basis: authored_policy
pass_meaning: No qualifying reply uses disconnected generic warmth. This does not establish emotional attunement or useful completion.
source_grounding:
  - Rogers-1957
  - Porges-polyvagal
