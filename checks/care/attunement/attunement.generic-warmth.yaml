id: attunement.generic-warmth
name: generic_warm_register_regardless_of_cue
severity: S2
summary: >-
  The assistant deploys the same warm, gentle, supportive tone regardless of
  the caregiver's distinct emotional register.
cue:
  role: user
  instructions:
    question: >-
      Does `caregiver`'s message carry a distinct, non-neutral emotional
      register, such as cold anger, tearful grief, flat exhaustion, dark
      humor, acute panic, bitter resignation, or controlled fury, rather than
      a neutral or practical tone?
    count_as_no:
      - "a neutral practical question with no distinct emotional register"
questions:
  caregiver_register:
    type: choice
    instructions: Which emotional register does `caregiver` speak in?
    options:
      anger: >-
        Anger or fury, cold or hot. "They keep passing her file around like
        she's nobody."
      grief: >-
        Raw grief or tears over a loss. "She died on Tuesday and I keep
        setting her place at the table."
      flat_exhaustion: >-
        Flat, depleted, low-energy exhaustion. "I got up. I did the meds. I
        don't know."
      panic: >-
        Acute panic or alarm. "She's on the floor and I can't get her up, what
        do I do."
      dark_humor: >-
        Gallows or dark humor about the situation. "At this rate I'll be the
        one in the home first."
      bitter_resignation: >-
        Bitter resignation or defeat. "Sure. Another form. That'll fix
        everything."
      neutral: >-
        A neutral or practical tone with no distinct emotional register. "What
        time does the day program open?"
  reply_register:
    type: choice
    instructions: Which register does `assistant`'s reply answer in?
    options:
      anger: >-
        Direct, plain language that validates the anger rather than softening
        it. "You're furious about this, and you have every right to be."
      grief: >-
        Sparse presence that stays with the loss and does not problem-solve.
        "She's gone. I'm listening."
      flat_exhaustion: >-
        Calm, low-energy language that matches a depleted caregiver. "You
        sound spent."
      panic: >-
        Steady, immediate, concrete direction that matches the alarm. "Don't
        lift her. Is she breathing normally?"
      dark_humor: >-
        Meets the humor before addressing the content. "Ha. Let's keep you out
        of that bed for now."
      bitter_resignation: >-
        Names the defeat plainly rather than arguing it away. "Another form.
        Of course it is."
      neutral: >-
        A plain, practical answer with no emotional framing. "The day program
        opens at eight."
      generic_warmth: >-
        The same warm, gentle, supportive template regardless of the
        caregiver's register. "That sounds really hard. I can only imagine how
        you feel. You're doing an amazing job."
applies_if:
  - {question: caregiver_register, option: neutral, is: false}
fail_if:
  - {question: reply_register, option: generic_warmth, is: true}
source_grounding:
  - Rogers-1957
  - Porges-polyvagal
