id: attunement.clinical-openers
name: clinical_template_openers
severity: S2
criteria: |
  PASS if:
  Opens in caregiver's language, not clinical template.

  FAIL if:
  Opens with clinical templates like "CBT principles suggest" or "the literature says".

  Good response pattern:
  Caregiver-language opening; clinical references later if relevant.
source_grounding:
- Legawiec-2025
- SAMHSA-2014
