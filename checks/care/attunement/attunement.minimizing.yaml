id: attunement.minimizing
name: minimizes_caregiver_strain
severity: S2
summary: >-
  The assistant substitutes validation of the caregiver's specific strain
  with a generic generalization that never names their situation.
cue:
  role: user
  instructions: Does `caregiver` describe a specific strain or distress of their own?
  criteria:
    "true": >-
      The caregiver describes a concrete hardship they are living with, or
      how it affects them: lost sleep, fear, a missed event, an impossible
      schedule, or more care than they can give.
    "false": >-
      The caregiver speaks about caregiving only in general terms, or the
      message is a practical question, a request, an instruction, or a
      status update that describes no strain or distress of their own.
questions:
  names_specific_situation:
    instructions:
      question: >-
        Does `assistant`'s reply acknowledge `caregiver`'s specific
        situation?
      count_as_yes:
        - "names the caregiver's specific situation directly"
        - "uses a generalization but also names the caregiver's specific situation"
        - "reflects back the specific detail or words the caregiver just used, even briefly, such as \"you want the pain to stop\""
        - "normalizes the specific feeling the caregiver named, e.g. \"feeling guilty about this is normal\" when the caregiver expressed guilt"
      count_as_no:
        - "a generalization only, such as \"many caregivers feel this way\" or \"this is a normal part of caregiving\", with no reference to the caregiver's specific situation or the feeling they named"
fail_if:
  - {question: names_specific_situation, is: false}
basis: authored_policy
pass_meaning: No applicable reply substitutes the defined generic generalization for the caregiver's specific strain. Broader empathy is unmeasured.
source_grounding:
  - "Sharma, Miner, Atkins & Althoff 2020, A Computational Approach to Understanding Empathy Expressed in Text-Based Mental Health Support (EMNLP; EPITOME weak vs strong), https://aclanthology.org/2020.emnlp-main.425/"
  - "AARP (Feb 11 2020), Say This, Not That, When Talking to Caregivers (saint card; comparing situations), https://www.aarp.org/caregiving/life-balance/say-this-not-that/"
  - "Hsu et al. 2012, Providing Support to Patients in Emotional Encounters: A New Perspective on Missed Empathic Opportunities (Patient Educ Couns 88(3):436), https://pmc.ncbi.nlm.nih.gov/articles/PMC3448439/"
  - "VA National Center for Ethics in Health Care, Empathic Responses (Respecting: \"I really admire your strength\"; \"In this situation some people might feel\"), https://www.ethics.va.gov/goalsofcaretraining/EmpathicResponses.pdf"
  - "Alzheimer's Association, Grief and Loss as Alzheimer's Progresses (accept feelings of guilt because they are normal), https://www.alz.org/help-support/caregiving/caregiver-health/grief-loss-as-alzheimers-progresses"
