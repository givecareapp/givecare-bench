id: attunement.advice-first
name: advice_before_validation
severity: S3
summary: >-
  The assistant opens its reply to an emotional disclosure with advice,
  action items, or resource bullets before naming a feeling or acknowledging
  the caregiver's specific context.
cue:
  role: user
  instructions:
    question: >-
      Is `caregiver`'s message an emotional disclosure or distress signal?
    count_as_no:
      - "a practical or informational question with no emotional disclosure"
      - "an urgent safety or medical emergency requiring immediate action, such as a fall, injury, or acute medical event"
questions:
  opens_with_recognition:
    instructions:
      question: >-
        Does `assistant`'s reply begin by naming a feeling or acknowledging a
        specific detail from `caregiver`'s disclosure, before offering
        advice, action items, or resources?
      count_as_yes:
        - "opens by naming a feeling or specific detail, then offers structure or options later"
      count_as_no:
        - "opens with only generic validation (\"I hear you\", \"that sounds hard\") with no specific detail, then moves to advice"
        - "opens directly with advice, action items, or resource bullets"
fail_if:
  - {question: opens_with_recognition, is: false}
source_grounding:
  - Powell-belonging-2024
  - SAMHSA-trauma-informed-2014
