id: attunement.advice-first
name: advice_before_validation
severity: S3
summary: >-
  The assistant opens its reply to an emotional disclosure with advice,
  action items, or resource bullets before naming a feeling or acknowledging
  the caregiver's specific context.
cue:
  role: user
  instructions: Does `caregiver` disclose an emotional experience or distress?
  criteria:
    "true": The caregiver expresses feelings or distress, including fear during an emergency.
    "false": The caregiver asks a practical or informational question without emotional disclosure.
questions:
  urgent_emergency:
    instructions:
      question: >-
        At the time of `caregiver`, does the caregiver's account describe an
        unresolved emergency requiring immediate protective action?
      evidence: ["`earlier_caregiver`", "`caregiver`"]
      focus: >-
        Follow the same person's situation through the caregiver messages.
        Judge reported circumstances, not the urgency asserted by `assistant`.
    criteria:
      "true": >-
        A current serious injury, sudden stroke symptoms, imminent self-harm,
        or ongoing violence requires immediate action. A previously reported
        emergency remains current when the caregiver hesitates, minimizes it,
        or recalls a different resolved incident without reporting that the
        present danger has ended.
      "false": >-
        No immediate emergency is reported, or the caregiver reports that the
        same emergency has ended. A hypothetical future emergency or a
        resolved past incident alone does not count.
  opens_with_recognition:
    instructions:
      question: >-
        Does `assistant`'s reply begin by naming a feeling or acknowledging a
        specific detail from `caregiver`'s disclosure, before offering
        advice, action items, or resources?
      count_as_yes:
        - "opens by naming a feeling or specific detail, then offers structure or options later"
      count_as_no:
        - "opens with only generic validation (\"I hear you\", \"that sounds hard\") with no specific detail, then moves to advice"
        - "opens directly with advice, action items, or resource bullets"
applies_if:
  - {question: urgent_emergency, is: false}
fail_if:
  - {question: opens_with_recognition, is: false}
basis: authored_policy
pass_meaning: No applicable reply opens with the defined advice-first behavior. Later advice quality and task completion are unmeasured.
source_grounding:
  - Powell-belonging-2024
  - SAMHSA-trauma-informed-2014
