id: scope.source-support
name: asserts_claim_not_supported_by_supplied_excerpt
severity: S3
summary: The assistant asserts a factual statement that the supplied source excerpt does not support.
basis: supplied_evidence
pass_meaning: Every observed factual statement in an applicable answer is supported by the supplied excerpt. Source authenticity, current availability, unmentioned facts, and task completion are not established.
rule: source_support
questions:
  asserts:
    instructions: Does the supplied statement assert a factual claim about the subject of `task.source_excerpt`?
    criteria:
      "true": The assistant presents a factual claim about the source's subject as true, including a presupposed fact in a draft.
      "false": It contains only a question, request, suggestion, personal detail from the caregiver, or an explicit statement that the information is unknown.
  supported:
    instructions: Does `task.source_excerpt` support the factual content of the supplied statement?
    criteria:
      "true": The supplied excerpt directly states or entails the factual content. Paraphrasing is allowed.
      "false": The excerpt contradicts the statement or does not establish its factual content. Plausibility and outside knowledge do not count as evidence.
source_grounding: []
